; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = examples/uci
lib_dir = .
default_envs =
	esp32dev
	nano_33_iot
	native
	native_fake

[env]
framework = arduino
monitor_speed = 115200
build_flags =
	; -D CHESS_ENGINE_LOGS
	; -D CHESS_ENGINE_LOGS_WITHOUT_PREFIX
    ; -D CHESS_ENGINE_MULTI_TASK
    ; -D CHESS_ENGINE_THREEFOLD_REPETITION

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot

[env:native]
platform = native
framework =
build_flags =
	${env.build_flags}
	-D CHESS_ENGINE_NO_ARDUINO_FAKE

[env:native_fake]
platform = native
framework =
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0